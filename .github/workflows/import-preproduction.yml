name: Import preproduction ZIP
on:
  push:
    paths:
      - 'the-crawl-preproduction-CODEX*.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract package into repository root
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          files = sorted(Path('.').glob('the-crawl-preproduction-CODEX*.zip'))
          if len(files) != 1:
              raise SystemExit(f'Expected exactly one uploaded ZIP, found {len(files)}')
          with zipfile.ZipFile(files[0]) as z:
              members = [m for m in z.infolist() if not m.is_dir()]
              for m in members:
                  parts = Path(m.filename).parts
                  if len(parts) < 2 or parts[0] != 'the-crawl-preproduction' or any(p in ('..', '') for p in parts):
                      raise SystemExit(f'Unexpected ZIP path: {m.filename}')
                  target = Path(*parts[1:])
                  if target.is_absolute() or target.parts[0] == '.git':
                      raise SystemExit(f'Unsafe target: {target}')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(m))
          print(f'Extracted {len(members)} files')
          PY
          rm -f the-crawl-preproduction-CODEX*.zip
      - name: Validate preproduction
        run: |
          python3 tools/validate.py
          python3 -m unittest discover -s tests -v
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Import complete preproduction design package" && git push)
